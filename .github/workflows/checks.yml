# The app's tests, Pint and PHPStan, on every push and pull request.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its run in progress; runs on main always finish.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, intl
          coverage: none
          tools: composer:v2

      # vendor/ from the last run with the same lock file, so composer install only checks it.
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: vendor-${{ runner.os }}-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build the CSS and JavaScript
        run: npm ci && npm run build

      - run: cp .env.example .env && php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      # PHPStan's result cache, keyed by the code, so an unchanged file is not analysed again.
      - uses: actions/cache@v6
        with:
          path: /tmp/phpstan
          key: phpstan-${{ runner.os }}-${{ github.sha }}
          restore-keys: phpstan-${{ runner.os }}-

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      # One process per core. Tests on the seeded firm share one seeded copy per process (seedDemo).
      - name: Tests
        run: php artisan test --parallel --compact
